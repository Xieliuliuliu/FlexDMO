name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install desktop system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 fonts-noto-cjk
      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Audit dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements-test.txt
      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -v
      - name: Run desktop regression tests
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        run: python -m unittest discover -s flexdmo_app/tests -v
